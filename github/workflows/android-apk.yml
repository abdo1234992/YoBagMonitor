name: Build Wanasa Monitor APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project ZIP
        run: |
          mkdir -p source
          unzip -q YoBagMonitor-Notification-Monitor.zip -d source
          PROJECT_FILE=$(find source -name settings.gradle.kts -print -quit)
          if [ -z "$PROJECT_FILE" ]; then
            echo "Project files not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Wanasa-Monitor-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
